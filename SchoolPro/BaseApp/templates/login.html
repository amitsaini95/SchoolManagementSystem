{% extends "base.html" %}
{% load static %}
{% block content %}
<div class="container LoginContainer">
    <div class="row    " style="jusify-content:center;height:100vh;align-items:center">
        <div class="col-6">
            <img src="{% static 'img/review.png' %}" width="100%">
        </div>
        <div class="col-6 ">
            <h5>Login</h5>
        
        <form method="post" novalidate>
        {% csrf_token %}
        {% for fm in form %}
            <div class="form-group">
                {{fm.label_tag}}{{fm}}{{fm.errors|striptags}}
            </div>
        {% endfor %}
        <input type="submit" value="login" class="btn btn-danger my-3">
        {% if form.non_field_errors %}
            {% for error in form.non_field_errors %}
             <p class="alert alert-danger my-3">{{error}}</p>
            {% endfor %}
        {% endif %}
        
    </form>
        </div>
    </div>
</div>
{% endblock %}
